<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Boutique Afrique Style</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Accueil</a></li>
        <li><a href="catalogue.html">Catalogue</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Contactez-nous</h1>
    <form id="form-contact" class="formulaire-contact" novalidate>
      <label for="nom">Nom complet :</label>
      <input type="text" id="nom" name="nom" placeholder="Votre nom">

      <label for="email">Adresse email :</label>
      <input type="email" id="email" name="email" placeholder="exemple@domaine.com">

      <label for="message">Votre message :</label>
      <textarea id="message" name="message" rows="5" placeholder="Écrivez votre message ici..."></textarea>

      <button type="submit">Envoyer le message</button>
      <p id="message-retour"></p>
    </form>
  </main>
  <footer>
    <p>&copy; 2026 Boutique Afrique Style</p>
  </footer>
  <script src="js/contact.js"></script>
</body>
</html>
